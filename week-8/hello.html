<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            hello
        </title>
    </head>
    <body>
        <form>
            <input autocomplete="off" autofocus id="name" name="name" placeholder="Name" type="text">
            <input type="submit">
        </form>
        <script>

            let form = document.querySelector("form")
            form.addEventListener("submit", (e) => {
                let name = document.querySelector("#name").value
                alert("hello, " + name)
                e.preventDefault()
            })


        </script>
    </body>
</html>
