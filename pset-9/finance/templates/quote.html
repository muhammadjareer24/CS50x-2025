{% extends "layout.html" %}

{% block title %}
    Get Quote
{% endblock %}


{% block main %}
    <h1 class="mb-5">Stock Quote</h1>
    <form action="/quote" method="post" >
        <div class="mb-3">
        <input class="form-control mx-auto w-auto" type="text" name="symbol" placeholder="Enter stock symbol" required>
        </div>
        <button class="btn btn-primary" type="submit">Get Quote</button>
    </form>
{% endblock %}
