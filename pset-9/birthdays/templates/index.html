<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <title>Birthdays</title>
    </head>
    <body>
        <div class="header">
            <h1>Birthdays</h1>
        </div>
        <div class="container">
            <div class="section">

                <h2>{% if edit_birth %}Edit Birthday{% else %}Add a Birthday{% endif %}</h2>

                <form action="{% if edit_birth %}/update{% else %}/{% endif %}" method="post">
                {% if edit_birth %}
                    <input type="hidden" name="id" value="{{ edit_birth.id }}">
                {% endif %}

                    <input autofocus type="text" name="name" placeholder="Name" value="{{ edit_birth.name if edit_birth }}">
                    <input type="number" name="month" placeholder="Month" min="1" max="12" value="{{ edit_birth.month if edit_birth }}">
                    <input type="number" name="day" placeholder="Day" min="1" max="31" value="{{ edit_birth.day if edit_birth }}">
                    <button type="submit">{% if edit_birth %}Update{% else %}Add Birthday{% endif %}</button>
            </form>
            </div>

            <div class="section">

                <h2>All Birthdays</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>
                        </tr>
                    </thead>
                    <tbody>

                         {% for birthday in birthdays %}
                         <tr>
                            <td>{{ birthday.name }}</td>
                            <td>{{ birthday.month }}/{{ birthday.day }}</td>
                            <td>
                                <form class="edit-form" action="/edit" method="post">
                                    <input type="hidden" value="{{ birthday.id }}" name="id">
                                    <button class="edit-btn" type="submit">Edit</button>
                                </form>

                                <form class="delete-form" action="/delete" method="post">
                                    <input type="hidden" value="{{ birthday.id }}" name="id">
                                    <button class="delete-btn" type="submit">Delete</button>
                                </form>

                            </td>
                         </tr>
                         {% endfor %}

                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
